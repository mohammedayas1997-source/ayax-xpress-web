<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>Password Recovery | Ayax Xpress</title>

  <!-- Google Fonts & FontAwesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --input-bg: #0f172a;
      --border-dark: #334155;
      --accent-blue: #0284c7;
      --accent-cyan: #00f0ff;
      --text-white: #f8fafc;
      --text-muted: #94a3b8;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background-color: var(--bg-dark);
      color: var(--text-white);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow-x: hidden;
      overflow-y: auto !important;
      -webkit-overflow-scrolling: touch;
    }

    * { box-sizing: border-box; }

    .container {
      max-width: 440px;
      margin: 0 auto;
      padding: 40px 20px 60px 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .back-btn {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: var(--card-bg);
      border: 1px solid var(--border-dark);
      display: flex;
      justify-content: center;
      align-items: center;
      color: var(--text-white);
      text-decoration: none;
      font-size: 16px;
      cursor: pointer;
      margin-bottom: 20px;
      transition: all 0.2s;
    }

    .back-btn:hover {
      background: #334155;
    }

    .brand-group {
      text-align: center;
      margin-bottom: 24px;
    }

    .icon-circle {
      width: 60px;
      height: 60px;
      border-radius: 30px;
      background: rgba(0, 240, 255, 0.1);
      border: 1px solid rgba(0, 240, 255, 0.25);
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0 auto 12px auto;
      color: var(--accent-cyan);
      font-size: 24px;
    }

    .title {
      color: var(--text-white);
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 0.3px;
      margin: 0 0 6px 0;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 12.5px;
      margin: 0;
      line-height: 1.6;
      padding: 0 10px;
    }

    .form-card {
      background: var(--card-bg);
      border-radius: 18px;
      padding: 22px;
      border: 1px solid var(--border-dark);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
    }

    .label {
      color: var(--text-muted);
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.8px;
      margin: 12px 0 6px 0;
      display: block;
    }

    .label:first-child {
      margin-top: 0;
    }

    .input-wrap {
      display: flex;
      align-items: center;
      background: var(--input-bg);
      border-radius: 10px;
      padding: 0 12px;
      height: 48px;
      border: 1px solid var(--border-dark);
      transition: border-color 0.2s;
    }

    .input-wrap:focus-within {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 0 3px rgba(0, 240, 255, 0.12);
    }

    .input-wrap i {
      color: var(--text-muted);
      font-size: 16px;
      margin-right: 10px;
      width: 18px;
      text-align: center;
    }

    .input-field {
      flex: 1;
      height: 100%;
      border: none;
      background: transparent;
      color: var(--text-white);
      font-size: 13.5px;
      font-family: inherit;
      outline: none;
    }

    .input-field::placeholder {
      color: var(--text-muted);
      font-weight: normal;
    }

    .toggle-pass-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 16px;
      padding: 4px;
    }

    .primary-btn {
      width: 100%;
      height: 48px;
      background: var(--accent-blue);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.6px;
      cursor: pointer;
      margin-top: 22px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .primary-btn:hover {
      background: #0369a1;
      transform: translateY(-1px);
    }

    .primary-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    .resend-btn {
      display: block;
      width: 100%;
      background: none;
      border: none;
      text-align: center;
      color: var(--accent-cyan);
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 16px;
      line-height: 1.5;
    }

    .status-banner {
      display: none;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 12.5px;
      font-weight: 700;
      margin-bottom: 16px;
      text-align: center;
    }

    .status-success {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid #10b981;
      color: #34d399;
    }

    .status-error {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid #ef4444;
      color: #f87171;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Back Button -->
    <a href="index.html" class="back-btn" title="Back to Login">
      <i class="fa-solid fa-arrow-left"></i>
    </a>

    <!-- Brand / Title Header -->
    <div class="brand-group">
      <div class="icon-circle">
        <i class="fa-solid fa-lock"></i>
      </div>
      <h1 class="title">Password Recovery</h1>
      <p class="subtitle" id="formSubtitle">
        Enter your registered email or phone to receive an automatic verification link and OTP code.
      </p>
    </div>

    <!-- Status Banner -->
    <div id="statusBanner" class="status-banner"></div>

    <!-- STEP 1: Request OTP / Verification Link -->
    <section class="form-card" id="step1Card">
      <label class="label" for="identifierInput">EMAIL ADDRESS OR PHONE NUMBER</label>
      <div class="input-wrap">
        <i class="fa-regular fa-envelope"></i>
        <input
          type="text"
          id="identifierInput"
          class="input-field"
          placeholder="e.g. agent@ayaxdata.online"
          autocomplete="username"
        />
      </div>

      <button type="button" class="primary-btn" id="btnRequestReset" onclick="handleRequestReset()">
        SEND RESET LINK & OTP
      </button>
    </section>

    <!-- STEP 2: Enter OTP & Set New Password -->
    <section class="form-card" id="step2Card" style="display: none;">
      <label class="label" for="otpInput">4-DIGIT VERIFICATION CODE (OTP)</label>
      <div class="input-wrap">
        <i class="fa-solid fa-shield-halved" style="color: var(--accent-cyan);"></i>
        <input
          type="text"
          id="otpInput"
          class="input-field"
          placeholder="e.g. 4819"
          maxlength="4"
          inputmode="numeric"
          style="letter-spacing: 4px; font-weight: 900; font-size: 16px;"
        />
      </div>

      <label class="label" for="newPasswordInput">NEW STRONG PASSWORD</label>
      <div class="input-wrap">
        <i class="fa-solid fa-lock"></i>
        <input
          type="password"
          id="newPasswordInput"
          class="input-field"
          placeholder="Enter new password (min 6 chars)"
          autocomplete="new-password"
        />
        <button type="button" class="toggle-pass-btn" onclick="togglePassVisibility('newPasswordInput', this)">
          <i class="fa-regular fa-eye"></i>
        </button>
      </div>

      <label class="label" for="confirmPasswordInput">CONFIRM NEW PASSWORD</label>
      <div class="input-wrap">
        <i class="fa-regular fa-circle-check"></i>
        <input
          type="password"
          id="confirmPasswordInput"
          class="input-field"
          placeholder="Re-type new password"
          autocomplete="new-password"
        />
        <button type="button" class="toggle-pass-btn" onclick="togglePassVisibility('confirmPasswordInput', this)">
          <i class="fa-regular fa-eye"></i>
        </button>
      </div>

      <button type="button" class="primary-btn" id="btnSetNewPassword" onclick="handleSetNewPassword()">
        RESET & AUTHORIZE PASSWORD
      </button>

      <button type="button" class="resend-btn" onclick="setStep(1)">
        Didn't receive email? Change identifier or resend
      </button>
    </section>
  </div>

  <!-- Scripts -->
  <script src="js/config.js"></script>
  <script>
    const BASE_URL = (typeof CONFIG !== 'undefined' && CONFIG.BASE_URL)
      ? CONFIG.BASE_URL
      : "https://ayax-data-xpress-server.onrender.com/api/v1";

    let savedIdentifier = "";

    function setStep(stepNumber) {
      const step1Card = document.getElementById('step1Card');
      const step2Card = document.getElementById('step2Card');
      const subtitle = document.getElementById('formSubtitle');

      if (stepNumber === 1) {
        step1Card.style.display = 'block';
        step2Card.style.display = 'none';
        subtitle.textContent = "Enter your registered email or phone to receive an automatic verification link and OTP code.";
      } else {
        step1Card.style.display = 'none';
        step2Card.style.display = 'block';
        subtitle.textContent = `Enter the 4-digit code sent to ${savedIdentifier} and choose your new password.`;
        setTimeout(() => document.getElementById('otpInput').focus(), 100);
      }
    }

    function showFeedback(message, isSuccess = true) {
      const banner = document.getElementById('statusBanner');
      banner.textContent = message;
      banner.className = `status-banner ${isSuccess ? 'status-success' : 'status-error'}`;
      banner.style.display = 'block';

      setTimeout(() => {
        banner.style.display = 'none';
      }, 6000);
    }

    function togglePassVisibility(inputId, btn) {
      const input = document.getElementById(inputId);
      const icon = btn.querySelector('i');
      if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'fa-regular fa-eye-slash';
      } else {
        input.type = 'password';
        icon.className = 'fa-regular fa-eye';
      }
    }

    async function handleRequestReset() {
      const identifier = document.getElementById('identifierInput').value.trim();
      if (!identifier) {
        alert("Input Error: Please enter your registered Email or Phone Number.");
        return;
      }

      savedIdentifier = identifier;
      const btn = document.getElementById('btnRequestReset');
      const originalText = btn.innerHTML;

      try {
        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Sending...';

        const response = await fetch(`${BASE_URL}/auth/forgot-password`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            identifier: identifier,
            email: identifier
          })
        });

        const data = await response.json();

        if (response.ok && (data.success || response.status === 200)) {
          showFeedback(data.message || "Reset link and OTP sent to your registered email.", true);
          alert(`Dispatched: ${data.message || "Reset link and OTP sent to your registered email."}`);
          setStep(2);
        } else {
          throw new Error(data.message || "Failed to process request");
        }
      } catch (err) {
        alert("Request Notice: " + (err.message || "Server response delayed. Check your email."));
        showFeedback(err.message || "Server response delayed.", false);
        setStep(2);
      } finally {
        btn.disabled = false;
        btn.innerHTML = originalText;
      }
    }

    async function handleSetNewPassword() {
      const otp = document.getElementById('otpInput').value.trim();
      const newPassword = document.getElementById('newPasswordInput').value.trim();
      const confirmPassword = document.getElementById('confirmPasswordInput').value.trim();

      if (!otp || otp.length < 4) {
        alert("Validation Error: Please enter the valid 4-digit OTP code sent to your email.");
        return;
      }

      if (!newPassword || newPassword.length < 6) {
        alert("Validation Error: Password must be at least 6 characters long.");
        return;
      }

      if (newPassword !== confirmPassword) {
        alert("Validation Error: Passwords do not match.");
        return;
      }

      const btn = document.getElementById('btnSetNewPassword');
      const originalText = btn.innerHTML;

      try {
        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Resetting...';

        const response = await fetch(`${BASE_URL}/auth/reset-password`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            identifier: savedIdentifier,
            email: savedIdentifier,
            otp: otp,
            newPassword: newPassword
          })
        });

        const data = await response.json();

        if (response.ok && (data.success || response.status === 200)) {
          alert("Success 🎉: Your password has been reset successfully. Please login.");
          window.location.href = "index.html";
        } else {
          throw new Error(data.message || "Could not reset password.");
        }
      } catch (err) {
        alert("Reset Error: " + (err.message || "Failed to reset password."));
        showFeedback(err.message || "Failed to reset password.", false);
      } finally {
        btn.disabled = false;
        btn.innerHTML = originalText;
      }
    }
  </script>
  <script src="js/config.js"></script>
</body>
</html>
