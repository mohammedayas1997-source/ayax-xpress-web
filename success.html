<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>Deployment Complete | Ayax Xpress</title>

  <!-- Google Fonts & FontAwesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-white: #ffffff;
      --primary-navy: #1e3a8a;
      --primary-navy-hover: #172554;
      --accent-green: #10b981;
      --text-dark: #0f172a;
      --text-muted: #64748b;
    }

    * {
      box-sizing: border-box;
      text-decoration: none !important;
      -webkit-text-decoration-line: none !important;
      outline: none !important;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: var(--bg-white);
      color: var(--text-dark);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow-x: hidden;
      overflow-y: auto !important;
      -webkit-overflow-scrolling: touch;
    }

    .main-wrapper {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 20px;
    }

    .container {
      width: 100%;
      max-width: 520px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Animated Success Icon */
    .icon-circle {
      margin-bottom: 28px;
      display: flex;
      justify-content: center;
      align-items: center;
      animation: bounceScale 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    .icon-circle i {
      font-size: 96px;
      color: var(--accent-green);
      filter: drop-shadow(0 10px 20px rgba(16, 185, 129, 0.25));
    }

    @keyframes bounceScale {
      0% {
        transform: scale(0);
        opacity: 0;
      }
      80% {
        transform: scale(1.1);
        opacity: 1;
      }
      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    .title {
      font-size: 22px;
      font-weight: 900;
      color: var(--text-dark);
      letter-spacing: 1px;
      margin: 0 0 10px 0;
      text-transform: uppercase;
      line-height: 1.3;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 14px;
      line-height: 1.6;
      margin: 0;
      max-width: 440px;
      font-weight: 500;
    }

    .action-button {
      margin-top: 36px;
      background: var(--primary-navy);
      color: #ffffff;
      padding: 16px 42px;
      border-radius: 12px;
      border: none;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(30, 58, 138, 0.25);
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .action-button:hover {
      background: var(--primary-navy-hover);
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(30, 58, 138, 0.35);
    }
  </style>
</head>
<body>

  <div class="main-wrapper">
    <div class="container">

      <!-- Success Check Icon -->
      <div class="icon-circle">
        <i class="fa-solid fa-circle-check"></i>
      </div>

      <!-- Title Dynamic Text -->
      <h1 class="title" id="deploymentTitle">DEPLOYMENT COMPLETE</h1>

      <!-- Subtitle Description -->
      <p class="subtitle" id="deploymentSubtitle">
        Your profile and virtual banking infrastructure have been successfully integrated into the Ayax architecture.
      </p>

      <!-- Action Button -->
      <button type="button" class="action-button" onclick="handleAccessTerminal()">
        <span>ACCESS TERMINAL</span>
      </button>

    </div>
  </div>

  <script>
    let state = {
      userRole: ""
    };

    window.addEventListener('DOMContentLoaded', () => {
      try {
        const storedUserData = localStorage.getItem('userData');
        if (storedUserData) {
          const user = JSON.parse(storedUserData);
          const detectedRole = (
            user?.role ||
            user?.data?.role ||
            user?.user?.role ||
            ""
          ).trim().toLowerCase();
          state.userRole = detectedRole;
        }
      } catch (e) {
        console.warn("Error reading user role context:", e);
      }

      updateScreenContext();
    });

    function updateScreenContext() {
      const isAgent = state.userRole === "agent";
      const titleEl = document.getElementById('deploymentTitle');
      const subEl = document.getElementById('deploymentSubtitle');

      if (isAgent) {
        titleEl.textContent = "AGENT DEPLOYMENT COMPLETE";
        subEl.textContent = "Your elite agent profile, merchant terminal access, and corporate virtual banking infrastructure have been successfully integrated into the Ayax architecture.";
      } else {
        titleEl.textContent = "DEPLOYMENT COMPLETE";
        subEl.textContent = "Your profile and virtual banking infrastructure have been successfully integrated into the Ayax architecture.";
      }
    }

    function handleAccessTerminal() {
      // Idan akwai token da bayanan mai amfani a ajiye, tura shi kai tsaye zuwa dacewar dashboard
      const token = localStorage.getItem('userToken');
      const role = state.userRole;

      if (token && role) {
        if (role === "agent") {
          window.location.href = "agent-dashboard.html";
        } else if (role === "supervisor") {
          window.location.href = "admin-control.html";
        } else if (role === "leader" || role === "state_manager") {
          window.location.href = "leader-dashboard.html";
        } else if (role === "admin" || role === "superadmin") {
          window.location.href = "admin-dashboard.html";
        } else {
          window.location.href = "customer-dashboard.html";
        }
      } else {
        // In babu, koma babban shafin shiga
        window.location.href = "index.html";
      }
    }
  </script>
</body>
</html>
